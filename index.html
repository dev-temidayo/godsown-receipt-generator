<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="stylesheet" href="general.css">
    <link rel="stylesheet" href="style.css">

    <title>God's Own Invoice Generator</title>
</head>
<body>
    <div class="container">
        <header>
            <div class="left-section">
                <img class="logo" src="images/logo.png" alt="logo">

                <div>
                    <h5 class="logo-name">GOD'S OWN</h5>
                    <h5 class="logo-name-ent">Enterprises</h5>
                    <h6 class="web-details">Professional Invoice Studio</h6>
                </div>
            </div>

            <div class="right-section">
                <button id="save-draft-btn" class="btn btn-primary">
                    <i class="fa-solid fa-floppy-disk" style="color: #ffd98c;"></i>
                    Save Draft
                </button>
              <button id="reset-btn" class="btn btn-primary">
                    <i class="fa-solid fa-rotate-left" style="color: #ffd98c;"></i>
                    Reset
                </button>
                <button id="generate-invoice-btn" class="btn btn-secondary">
                    <i class="fa-solid fa-paper-plane" style="color: #243757;"></i>
                    Generate Invoice
                </button>
            </div>

            <!-- Three Dot Toggle -->
            <button id="menu-toggle" class="menu-toggle-btn">
                <i class="fa-solid fa-ellipsis-vertical" style="color: #ffffff;"></i>
            </button>

            <!-- Mobile Dropdown -->
            <div id="mobile-menu" class="mobile-dropdown">
                <button id="save-draft-1" class="btn btn-primary">Save Draft</button>
                <button id="reset-1" class="btn btn-primary">Reset</button>
                <button id="generate-invoice-1" class="btn btn-secondary">Generate Invoice</button>
            </div>
        </header>

        <main>
            <h5 class="invoice-info-header">
                <i class="fa-solid fa-sliders" style="color: #ffd98c;"></i>
                Invoice Editor Controls
            </h5>

            <div class="client-info-box">
                <h6 class="client-header-text">
                    <i class="fa-solid fa-address-card" style="color: #ffd98c;"></i>
                    CLIENT & HEADER INFO
                </h6>

                <div class="info-box-grid">
                    <div class="name-field">
                        <label for="client-name-input">
                            Client Name
                        </label>
                        <input id="client-name-input" class="input input-primary" type="text" placeholder="Abradi Opas Kim" required>
                    </div>
                    <div class="phone-field">
                        <label for="client-phone-input">
                            Client Phone
                        </label>
                        <input id="client-phone-input" class="input input-primary" type="tel" placeholder="+234-806-255-4720" required>
                    </div>
                    <div class="invoice-type-field">
                        <label for="invoice-type-input">
                            Invoice Type
                        </label>
                        <select id="invoice-type-input" class="select select-primary">
                            <option value="Event Planning and Management">Event Planning and Management</option>
                            <option value="Cargo Logistics">Cargo Logistics</option>
                        </select>
                    </div>
                    <div class="date-field">
                        <label for="invoice-date-input">
                            Invoice Date
                        </label>
                        <input id="invoice-date-input" class="input input-primary" type="date" required>
                    </div>
                    <div class="currency-field">
                        <label for="currency-input">Currency Symbol</label>
                        <select id="currency-input" class="select select-primary">
                            <option value="₦">Naira (₦)</option>
                            <option value="$">USD ($)</option>
                            <option value="£">GBP (£)</option>
                            <option value="€">EUR (€)</option>
                        </select>
                    </div>
                    <div class="address-field">
                        <label for="client-address-input">
                            Client Address
                        </label>
                        <input id="client-address-input" class="input input-primary" type="text" placeholder="1, Beco Street, Off Babaponmile Street, Mangoro, Ikeja, Lagos." required>
                    </div>
                </div>
            </div>

            <div class="line-items-box">
                <h6 class="line-items-text">
                    <i class="fa-solid fa-list-ul" style="color: #ffd98c;"></i>
                    LINE ITEMS
                </h6>

                <div id="items-container" class="info-box-flex">

                </div>

                <button id="add-item-btn" class="btn btn-secondary add-item-btn">
                    Add item
                </button>
            </div>

            <div class="payment-details-box">
                <h6 class="payment-details-text">
                   <i class="fa-solid fa-file-pen" style="color: #ffd98c;"></i>
                   PAYMENT & SIGNATORY DETAILS 
                </h6>

                <div class="info-box-grid">
                    <div>
                        <label for="payment-method-input">
                            Payment Method Line
                        </label>
                        <select id="payment-method-input" class="select select-primary">
                            <option value="Payment via Bank Transfer">Payment via Bank Transfer</option>
                            <option value="Payment via Cash">Payment via Cash</option>
                            <option value="Payment via Debit Card">Payment via Debit Card</option>
                            <option value="Payment via Cheque">Payment via Cheque</option>
                        </select>
                    </div>
                    <div>
                        <label for="signee-name-input">
                            Signatory Name
                        </label>
                        <input id="signee-name-input" class="input input-primary" type="text" placeholder="Lukman Toluwani" required>
                    </div>
                    <div>
                        <label for="signee-badge-input">
                            Signatory Name Badge
                        </label>
                        <input id="signee-badge-input" class="input input-primary" type="text" placeholder="Manager" required>
                    </div>
                    <div>
                        <label for="percentage-pay-input">
                            Upfront Paymnent Percentage
                        </label>
                        <input id="percentage-pay-input" class="input input-primary" type="number" placeholder="50" min="0" max="100" required>
                    </div>
                </div>
            </div>

            <button id="generate-invoice-2" class="btn btn-secondary">
                <i class="fa-solid fa-paper-plane" style="color: #243757;"></i>
                Generate Invoice

        </main>

    <script src="header.js"></script>
    <script src="script.js"></script>
</body>
